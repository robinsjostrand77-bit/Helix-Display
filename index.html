<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Helix Display</title>

    <!-- PWA-inställningar för fristående app på iPhone -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Helix Display">

    <style>
        :root {
            --bg-color: #0a0a0a;
            --panel-color: #b0b0b0; /* Ljusgrå för inaktiva presets */
            --text-main: #000000;  /* Svart text */
            --active-bg: #c1ffb2;  /* Ljusgrön färg för aktiva val */
            --border-color: #222222;
            --snap-inactive: #333336; /* Mörkgrå för inaktiva snapshots */

            /* Färger för aktiva snapshots */
            --snap-color-0: #ff3b30; /* Röd */
            --snap-color-1: #007aff; /* Blå */
            --snap-color-2: #4cd964; /* Ljusgrön */
            --snap-color-3: #008726; /* Mörkgrön */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            color: #ffffff;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            padding: calc(env(safe-area-inset-top) + 10px) 10px calc(env(safe-area-inset-bottom) + 10px) 10px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 10px;
            margin-bottom: 8px;
            background: #111;
            border-radius: 6px;
            font-size: 11px;
        }

        .status {
            color: #ff3b30;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status.connected {
            color: #4cd964;
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
        }

        .btn {
            background: #222;
            color: #aaa;
            border: 1px solid #333;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
        }

        .file-input-wrapper input[type=file] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
            height: 100%;
            width: 100%;
        }

        /* HUVUDGRID: 4 kolumner */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            flex-grow: 1;
            width: 100%;
            height: 85%;
            margin-bottom: 5px;
        }

        .channel-column {
            display: flex;
            flex-direction: column;
            height: 100%;
            gap: 10px;
        }

        /* PRESET-DISPLAY */
        .strip {
            height: 75%; 
            background-color: var(--panel-color);
            border: 2px solid var(--border-color);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 15px;
        }

        .strip-index {
            position: absolute;
            top: 12px;
            left: 12px;
            font-size: 14px;
            font-weight: bold;
            color: var(--text-main);
            opacity: 0.6;
        }

        .strip-name {
            font-size: 4.2vw; 
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-main);
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .strip.active {
            background-color: var(--active-bg);
            border-color: var(--active-bg);
            box-shadow: 0 0 30px rgba(193, 255, 178, 0.3);
        }

        .strip.active .strip-index {
            opacity: 1;
        }

        /* SNAPSHOT-DISPLAY */
        .snapshot-row {
            height: 25%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .snap-btn {
            background-color: var(--snap-inactive);
            border: 1px solid #222;
            border-radius: 6px;
            height: 100%;
            transition: background-color 0.1s;
        }

        .snap-btn.col-0.active {
            background-color: var(--snap-color-0);
            border-color: var(--snap-color-0);
            box-shadow: 0 0 15px rgba(255, 59, 48, 0.5);
        }

        .snap-btn.col-1.active {
            background-color: var(--snap-color-1);
            border-color: var(--snap-color-1);
            box-shadow: 0 0 15px rgba(0, 122, 255, 0.5);
        }

        .snap-btn.col-2.active {
            background-color: var(--snap-color-2);
            border-color: var(--snap-color-2);
            box-shadow: 0 0 15px rgba(76, 217, 100, 0.5);
        }

        .snap-btn.col-3.active {
            background-color: var(--snap-color-3);
            border-color: var(--snap-color-3);
            box-shadow: 0 0 15px rgba(0, 135, 38, 0.5);
        }
    </style>
</head>
<body>

    <header>
        <div class="file-input-wrapper">
            <button class="btn">Import Setlist (.hls)</button>
            <input type="file" id="fileInput" accept=".hls">
        </div>
        <div id="midiStatus" class="status">MIDI: INITIALIZING...</div>
    </header>

    <div class="grid-container">
        <!-- PLATS 1 (A) -->
        <div class="channel-column">
            <div class="strip" id="preset0">
                <div class="strip-index">1A</div>
                <div class="strip-name" id="pName0">CLEAN RHYTHM</div>
            </div>
            <div class="snapshot-row">
                <div class="snap-btn col-0" id="snap-0-0"></div>
                <div class="snap-btn col-1" id="snap-0-1"></div>
                <div class="snap-btn col-2" id="snap-0-2"></div>
                <div class="snap-btn col-3" id="snap-0-3"></div>
            </div>
        </div>

        <!-- PLATS 2 (B) -->
        <div class="channel-column">
            <div class="strip" id="preset1">
                <div class="strip-index">1B</div>
                <div class="strip-name" id="pName1">CRUNCH DRIVE</div>
            </div>
            <div class="snapshot-row">
                <div class="snap-btn col-0" id="snap-1-0"></div>
                <div class="snap-btn col-1" id="snap-1-1"></div>
                <div class="snap-btn col-2" id="snap-1-2"></div>
                <div class="snap-btn col-3" id="snap-1-3"></div>
            </div>
        </div>

        <!-- PLATS 3 (C) -->
        <div class="channel-column">
            <div class="strip" id="preset2">
                <div class="strip-index">1C</div>
                <div class="strip-name" id="pName2">HEAVY LEAD</div>
            </div>
            <div class="snapshot-row">
                <div class="snap-btn col-0" id="snap-2-0"></div>
                <div class="snap-btn col-1" id="snap-2-1"></div>
                <div class="snap-btn col-2" id="snap-2-2"></div>
                <div class="snap-btn col-3" id="snap-2-3"></div>
            </div>
        </div>

        <!-- PLATS 4 (D) -->
        <div class="channel-column">
            <div class="strip" id="preset3">
                <div class="strip-index">1D</div>
                <div class="strip-name" id="pName3">AMBIENT PAD</div>
            </div>
            <div class="snapshot-row">
                <div class="snap-btn col-0" id="snap-3-0"></div>
                <div class="snap-btn col-1" id="snap-3-1"></div>
                <div class="snap-btn col-2" id="snap-3-2"></div>
                <div class="snap-btn col-3" id="snap-3-3"></div>
            </div>
        </div>
    </div>

    <script>
        let activePresetIndex = 0; // Håller reda på vilken kolumn som körs

        // Starta MIDI-lyssnare
        if (navigator.requestMIDIAccess) {
            navigator.requestMIDIAccess().then(onMIDISuccess, onMIDIFailure);
        } else {
            document.getElementById('midiStatus').innerText = "MIDI: NOT SUPPORTED";
        }

        function onMIDISuccess(midiAccess) {
            const inputs = Array.from(midiAccess.inputs.values());
            if (inputs.length > 0) {
                document.getElementById('midiStatus').innerText = "MIDI: LISTENING...";
                document.getElementById('midiStatus').classList.add('connected');
                
                // Lyssna på ALLA inkommande MIDI-enheter
                inputs.forEach(input => {
                    input.onmidimessage = handleMidiMessage;
                });
            } else {
                document.getElementById('midiStatus').innerText = "MIDI: NO INPUT DEVICES";
            }
        }

        function onMIDIFailure() {
            document.getElementById('midiStatus').innerText = "MIDI: ACCESS DENIED";
        }

        // Tolka MIDI-data från Helix
        function handleMidiMessage(event) {
            const data = event.data;
            if (!data || data.length < 2) return;

            const statusByte = data[0];
            const command = statusByte & 0xF0; // Maskar ut kanalen

            // 1. LYSSNA PÅ PRESET-BYTEN (Program Change = 0xC0)
            if (command === 0xC0) {
                const pcValue = data[1];
